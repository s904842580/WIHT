server:
  port: ${WAHT_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: waht-java
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${WAHT_DB_URL:jdbc:mysql://localhost:3306/waht?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${WAHT_DB_USERNAME:root}
    password: "${WAHT_DB_PASSWORD:}"
    hikari:
      pool-name: waht-hikari-pool
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: -1

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.waht.platform.entity
  configuration:
    map-underscore-to-camel-case: true

waht:
  web:
    cors:
      allowed-origins: ${WAHT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      secret: "${WAHT_JWT_SECRET:waht-local-dev-secret-change-me-20260629}"
      expiration-minutes: ${WAHT_JWT_EXPIRATION_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    com.waht.platform: info
